name: Job Timeout Demo

on:
  push:
    branches:
      - main

jobs:
  timeout-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start job
        run: echo "Job started"

      - name: Long running task
        run: |
          echo "Starting long task..."
          sleep 300
          echo "Task completed"

      - name: Final step
        run: echo "Job completed successfully"
